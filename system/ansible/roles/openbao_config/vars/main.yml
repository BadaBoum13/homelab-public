---
# Verbatim HCL from vault-config-operator/config/{00-base,20-oidc-auth0}.yml.
vco_policy_admin_hcl: |
  path "sys/mounts" {
    capabilities = ["read", "list"]
  }
  path "sys/mounts/vco-managed/*" {
    capabilities = ["create", "read", "update", "delete", "list"]
  }
  path "sys/auth" {
    capabilities = ["read", "list"]
  }
  # Auth method config — scoped to kubernetes ROLES only. The kubernetes auth
  # mount's top-level config (auth/kubernetes/config) is bootstrapped manually
  # outside VCO (see openbao-k8s-auth-bootstrap.yml) and intentionally excluded
  # here so VCO cannot drift or overwrite it.
  path "auth/kubernetes/role/*" {
    capabilities = ["create", "read", "update", "delete", "list"]
  }
  path "sys/policies/acl/vco-*" {
    capabilities = ["create", "read", "update", "delete", "list"]
  }
  path "sys/policies/password/vco-*" {
    capabilities = ["create", "read", "update", "delete", "list"]
  }
  # KV secrets — templated by the calling entity's own Kubernetes namespace,
  # so one policy dynamically scopes each caller to ITS OWN namespace path
  # instead of granting blanket secret/* access to everyone.
  path "secret/data/{% raw %}{{identity.entity.aliases.{% endraw %}{{ k8s_auth_accessor }}{% raw %}.metadata.service_account_namespace}}{% endraw %}/*" {
    capabilities = ["create", "read", "update", "delete", "list"]
  }
  path "secret/metadata/{% raw %}{{identity.entity.aliases.{% endraw %}{{ k8s_auth_accessor }}{% raw %}.metadata.service_account_namespace}}{% endraw %}/*" {
    capabilities = ["read", "list"]
  }

  # Engine managed by terraform for auth0 secret for SSO
  path "auth0/data/{% raw %}{{identity.entity.aliases.{% endraw %}{{ k8s_auth_accessor }}{% raw %}.metadata.service_account_namespace}}{% endraw %}/*" {
    capabilities = ["read", "list"]
  }
  path "auth0/metadata/{% raw %}{{identity.entity.aliases.{% endraw %}{{ k8s_auth_accessor }}{% raw %}.metadata.service_account_namespace}}{% endraw %}/*" {
    capabilities = ["read", "list"]
  }

oidc_admin_hcl: |
  path "*" {
    capabilities = ["create", "read", "update", "delete", "list", "sudo"]
  }

homelab_password_policy_hcl: |
  length = 24
  rule "charset" {
    charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
    min-chars = 1
  }
  rule "charset" {
    charset = "0123456789"
    min-chars = 1
  }
  rule "charset" {
    charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
    min-chars = 1
  }
