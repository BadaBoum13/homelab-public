- hosts: k3s_cluster
  vars:
    k3s_become: true
  roles:
    - role: xanmanning.k3s

# The nightly shutdown script drains (and thus cordons) the node before
# power-off. Cordon state persists in k3s's datastore across reboots, so
# this uncordons the node again once k3s is ready after every boot.
- hosts: k3s_cluster
  become: true
  tasks:
    - name: Deploy k3s-uncordon systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s-uncordon.service
        mode: "0644"
        content: |
          [Unit]
          Description=Uncordon this node after k3s is ready
          After=k3s.service
          Requires=k3s.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml uncordon %H
          Restart=on-failure
          RestartSec=5s
          StartLimitBurst=10

          [Install]
          WantedBy=multi-user.target
      register: k3s_uncordon_unit

    - name: Enable and start k3s-uncordon service
      ansible.builtin.systemd:
        name: k3s-uncordon.service
        enabled: true
        daemon_reload: "{{ k3s_uncordon_unit.changed }}"
        state: started

# Provision the HSM PIN as a k8s secret so OpenBao can unseal against the HSM.
# Runs on a single k3s node (run_once), using the node's local k3s kubeconfig.
- hosts: k3s_cluster
  become: true
  gather_facts: false
  vars:
    kubeconfig_path: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Provision the OpenBao HSM PIN secret
      when: enable_hsm | bool
      run_once: true
      block:
        - name: Ensure the security namespace exists
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            state: present
            definition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: security

        - name: Create the openbao-hsm-pin secret
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: openbao-hsm-pin
                namespace: security
              stringData:
                pin: "{{ hsm_pin }}"
          no_log: true
