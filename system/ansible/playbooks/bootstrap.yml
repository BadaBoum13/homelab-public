---
- name: Bootstrap AMD64 serves and common packages
  hosts: amd64
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist

    - name: Install common packages
      apt:
        name:
          - curl
          - git
          - htop
          - vim
          - wget
          - zsh
        state: present

    - name: Install packages for longhorn
      apt:
        name:
          - open-iscsi
          - nfs-common
        state: present
      when: storage.enable | default(false)

    - name: Set zsh as default shell for root
      user:
        name: root
        shell: /bin/zsh

    - name: Set zsh as default shell for current user
      user:
        name: "{{ ansible_user }}"
        shell: /bin/zsh

    - name: Harden SSH configuration
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
        backup: yes
      with_items:
        - { regexp: "^PermitRootLogin", line: "PermitRootLogin no" }
        - {
            regexp: "^PasswordAuthentication",
            line: "PasswordAuthentication no",
          }
        - {
            regexp: "^ChallengeResponseAuthentication",
            line: "ChallengeResponseAuthentication no",
          }
        - { regexp: "^UsePAM", line: "UsePAM yes" }
        - { regexp: "^X11Forwarding", line: "X11Forwarding no" }
        - { regexp: "^AllowTcpForwarding", line: "AllowTcpForwarding no" }
        - { regexp: "^MaxAuthTries", line: "MaxAuthTries 3" }
        - { regexp: "^LoginGraceTime", line: "LoginGraceTime 30" }
        - { regexp: "^PermitEmptyPasswords", line: "PermitEmptyPasswords no" }
        - { regexp: "^ClientAliveInterval", line: "ClientAliveInterval 300" }
        - { regexp: "^ClientAliveCountMax", line: "ClientAliveCountMax 2" }
      notify: restart ssh

    - name: Allow passwordless sudo for current user
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/{{ ansible_user }}
        create: yes
        mode: "0440"
        line: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL"

    - name: Mount volume {{ storage.path_mount }}
      when: storage.enable | default(false)
      block:
        - name: Ensure {{ storage.path_mount }} directory exists
          ansible.builtin.file:
            path: "{{ storage.path_mount }}"
            state: directory
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"
            mode: '0755'

        - name: Ensure /mnt/short_live_storage directory exists
          ansible.builtin.file:
            path: "/mnt/short_live_storage"
            state: directory
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"
            mode: '0755'

        - name: Mount {{ storage.path_mount }}
          ansible.posix.mount:
            path: "{{ storage.path_mount }}"
            src: "UUID={{ storage.device_id }}"
            fstype: "{{ storage.fs_type }}"
            opts: defaults,nofail #,x-systemd.device-timeout=30
            state: mounted

  handlers:
    - name: restart ssh
      service:
        name: ssh
        state: restarted

