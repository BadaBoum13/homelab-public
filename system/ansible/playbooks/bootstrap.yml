---
- name: Bootstrap AMD64 serves and common packages
  hosts: amd64
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist

    - name: Install common packages
      apt:
        name:
          - curl
          - git
          - htop
          - vim
          - wget
          - zsh
          - cron
          - pip
          - python3
        state: present
    
    - name: Install ansible dependencies on the remote host
      ansible.builtin.pip:
        name:
          - kubernetes
        break_system_packages: true
        state: present

    - name: Install packages for longhorn
      apt:
        name:
          - open-iscsi
          - nfs-common
        state: present
      when: storage.enable | default(false)

    - name: Blacklist Longhorn iSCSI LUNs from multipath
      ansible.builtin.blockinfile:
        path: /etc/multipath.conf
        create: yes
        block: |
          blacklist {
              device {
                  vendor  "IET"
                  product "VIRTUAL-DISK"
              }
          }
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Longhorn iSCSI blacklist"
      when: storage.enable | default(false)
      notify: restart multipathd

    - name: Set zsh as default shell for root
      user:
        name: root
        shell: /bin/zsh

    - name: Set zsh as default shell for current user
      user:
        name: "{{ ansible_user }}"
        shell: /bin/zsh

    - name: Harden SSH configuration
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
        backup: yes
      with_items:
        - { regexp: "^PermitRootLogin", line: "PermitRootLogin no" }
        - {
            regexp: "^PasswordAuthentication",
            line: "PasswordAuthentication no",
          }
        - {
            regexp: "^ChallengeResponseAuthentication",
            line: "ChallengeResponseAuthentication no",
          }
        - { regexp: "^UsePAM", line: "UsePAM yes" }
        - { regexp: "^X11Forwarding", line: "X11Forwarding no" }
        - { regexp: "^AllowTcpForwarding", line: "AllowTcpForwarding no" }
        - { regexp: "^MaxAuthTries", line: "MaxAuthTries 3" }
        - { regexp: "^LoginGraceTime", line: "LoginGraceTime 30" }
        - { regexp: "^PermitEmptyPasswords", line: "PermitEmptyPasswords no" }
        - { regexp: "^ClientAliveInterval", line: "ClientAliveInterval 300" }
        - { regexp: "^ClientAliveCountMax", line: "ClientAliveCountMax 2" }
      when: harden_ssh | default(true)
      notify: restart ssh

    - name: Allow passwordless sudo for current user
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/{{ ansible_user }}
        create: yes
        mode: "0440"
        line: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL"

    - name: Mount volume {{ storage.path_mount_long_storage }}
      block:
        - name: Ensure {{ storage.path_mount_long_storage }} directory exists
          ansible.builtin.file:
            path: "{{ storage.path_mount_long_storage }}"
            state: directory
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"
            mode: '0755'

        - name: Ensure {{ storage.path_mount_short_storage }} directory exists
          ansible.builtin.file:
            path: "{{ storage.path_mount_short_storage }}"
            state: directory
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"
            mode: '0755'

        - name: Mount {{ storage.path_mount_long_storage }}
          ansible.posix.mount:
            path: "{{ storage.path_mount_long_storage }}"
            src: "UUID={{ storage.device_id }}"
            fstype: "{{ storage.fs_type }}"
            opts: defaults,nofail #,x-systemd.device-timeout=30
            state: mounted
          when: storage.enable_mount | default(false)
      when: storage.enable | default(false)

    - name: Deploy safe shutdown script (drains node before power-off)
      ansible.builtin.copy:
        dest: /usr/local/sbin/k3s-safe-shutdown.sh
        mode: "0700"
        owner: root
        content: |
          #!/bin/sh
          set -u
          /usr/local/bin/kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml \
            drain "$(hostname)" \
            --ignore-daemonsets \
            --delete-emptydir-data \
            --force \
            --timeout=480s
          /sbin/shutdown -h now

    - name: Add daily shutdown cron job
      ansible.builtin.cron:
        name: "Daily shutdown at 23:30"
        minute: "30"
        hour: "23"
        job: "/usr/local/sbin/k3s-safe-shutdown.sh"
        user: root

  handlers:
    - name: restart ssh
      service:
        name: ssh
        state: restarted

    - name: restart multipathd
      service:
        name: multipathd
        state: restarted

- name: Bootstrap SoftHSM2
  hosts: amd64
  become: true
  
  vars:
    hsm_token_label: "openbao-token"
    hsm_key_label: "openbao-unseal-key"
    hsm_key_id: "01"
    hsm_hmac_key_label: "openbao-hmac-key"
    hsm_hmac_key_id: "02"
    hsm_module_path: "/usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so"
    hsm_token_backup_dest: "/root/softhsm2-backup.tar.gz"
    hsm_token_gid: 10000
    hsm_token_group: "softhsm"
  tasks:
    - name: Create dedicated group for SoftHSM2 token access
      ansible.builtin.group:
        name: "{{ hsm_token_group }}"
        gid: "{{ hsm_token_gid }}"
        state: present
      when: enable_hsm | default(false)

    - name: Install SoftHSM2 and OpenSC
      ansible.builtin.apt:
        name:
          - softhsm2
          - opensc
        state: present
        update_cache: yes
      when: enable_hsm | default(false)

    - name: Create /etc/softhsm2.conf for OpenBao pod hostPath mount
      ansible.builtin.copy:
        dest: /etc/softhsm2.conf
        mode: "0644"
        content: |
          directories.tokendir = /var/lib/softhsm/tokens/
          objectstore.backend = file
          log.level = DEBUG
          slots.removable = true
      when: enable_hsm | default(false)

    - name: Check if HSM token already initialized
      ansible.builtin.command: softhsm2-util --show-slots
      register: hsm_slots
      changed_when: false
      when: enable_hsm | default(false)

    - name: Initialize SoftHSM2 token
      ansible.builtin.command: >
        softhsm2-util --init-token --free
        --label "{{ hsm_token_label }}"
        --pin "{{ hsm_pin }}"
        --so-pin "{{ hsm_so_pin }}"
      when:
        - enable_hsm | default(false)
        - hsm_token_label not in hsm_slots.stdout

    - name: Check if unseal key already exists
      ansible.builtin.command: >
        pkcs11-tool
        --module "{{ hsm_module_path }}"
        --token-label "{{ hsm_token_label }}"
        --login --pin "{{ hsm_pin }}"
        --list-objects
      register: hsm_objects
      changed_when: false
      when: enable_hsm | default(false)


    - name: Generate RSA-4096 unseal keypair in HSM token
      ansible.builtin.command: >
        pkcs11-tool
        --module "{{ hsm_module_path }}"
        --token-label "{{ hsm_token_label }}"
        --login --pin "{{ hsm_pin }}"
        --keypairgen --key-type RSA:4096
        --label "{{ hsm_key_label }}"
        --id {{ hsm_key_id }}
      notify: Back up SoftHSM2 token directory
      when:
        - enable_hsm | default(false)
        - hsm_key_label not in hsm_objects.stdout

    - name: Generate AES:256 HMAC key in HSM token
      ansible.builtin.command: >
        pkcs11-tool
        --module "{{ hsm_module_path }}"
        --token-label "{{ hsm_token_label }}"
        --login --pin "{{ hsm_pin }}"
        --keygen --key-type GENERIC:32
        --label "{{ hsm_hmac_key_label }}"
        --id {{ hsm_hmac_key_id }}
      notify: Back up SoftHSM2 token directory
      when:
        - enable_hsm | default(false)
        - hsm_hmac_key_label not in hsm_objects.stdout

    - name: Set permissions on SoftHSM2 token directory for container access
      ansible.builtin.file:
        path: /var/lib/softhsm/tokens
        owner: root
        group: "{{ hsm_token_group }}"
        recurse: yes
      when: enable_hsm | default(false)

    - name: Restrict directory perms (group-accessible, setgid)
      ansible.builtin.command: find /var/lib/softhsm/tokens -type d -exec chmod 2750 {} +
      changed_when: false
      when: enable_hsm | default(false)

    - name: Restrict file perms (group-readable only)
      ansible.builtin.command: find /var/lib/softhsm/tokens -type f -exec chmod 0660 {} +
      changed_when: false
      when: enable_hsm | default(false)

  handlers:
    - name: Back up SoftHSM2 token directory
      ansible.builtin.archive:
        path: /var/lib/softhsm/tokens/
        dest: "{{ hsm_token_backup_dest }}"
        format: gz
        mode: "0600"
      when: enable_hsm | default(false)