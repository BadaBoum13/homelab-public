k3s_control_node: true
k3s_server:
  write-kubeconfig-mode: '0644'
  # node-label:
  #   - "node.longhorn.io/default-disks-config='{{ longhorn_starage_labels | to_json}}'"
  # for docker installation
  snapshotter: native
  # These flags are highly recommended for Docker-in-Docker/WSL2
  kubelet-arg:
    - "eviction-hard=imagefs.available<1%,nodefs.available<1%"
    - "eviction-minimum-reclaim=imagefs.available=1%,nodefs.available=1%"

storage:
  enable: true
  enable_mount: false
  device_id: ""
  fs_type: "ext4"
  path_mount_long_storage: "/mnt/long_storage"
  path_mount_short_storage: "/mnt/short_live_storage"

longhorn_starage_labels:
  - path: "{{ storage.path_mount }}"
    allowScheduling: true
    # storageReserved: 10485760
    tags:
    - hdd
    - raid
    - slow
  - name: fast-ssd-disk
    path: "{{ storage.path_mount_short_storage }}"
    allowScheduling: true
    tags:
    - ssd
    - fast

k3s_agent:
  node-label:
    - "storage-raid=true"

tailscale:
  # auth_key: "--auth-key="
  opt: "--advertise-exit-node --ssh --hostname=homelab"
