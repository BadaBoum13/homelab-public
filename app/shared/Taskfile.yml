---
version: '3'

includes:
  homepage: ./homepage

tasks:
  default:
    desc: Deploy all shared components
    cmds:
      - task: namespace
      - task: repos
      - task: deploy

  namespace:
    desc: Create shared namespace
    cmds:
      - kubectl create namespace shared --dry-run=client -o yaml | kubectl apply -f -

  repos:
    desc: Add/update all Helm repositories
    cmds:
      - task: homepage:repos

  deploy:
    desc: Deploy all shared components
    cmds:
      - task: homepage:deploy

  clean:
    desc: Remove all shared components
    cmds:
      - task: homepage:clean
