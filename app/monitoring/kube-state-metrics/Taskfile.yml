---
version: '3'

tasks:
  default:
    desc: Deploy kube-state-metrics
    cmds:
      - task: deploy

  deploy:
    desc: Deploy kube-state-metrics using Helm
    vars:
      MONITORING_NS: monitoring
      REPO_NAME: oci://ghcr.io/prometheus-community/charts/kube-state-metrics
      RELEASE_NAME: kube-state-metrics
    cmds:
      - helm upgrade --install {{.RELEASE_NAME}} {{.REPO_NAME}} -n {{.MONITORING_NS}} -f {{.TASKFILE_DIR}}/values.yaml

  clean:
    desc: Remove kube-state-metrics
    vars:
      MONITORING_NS: monitoring
      RELEASE_NAME: kube-state-metrics
    cmds:
      - helm uninstall {{.RELEASE_NAME}} -n {{.MONITORING_NS}} --ignore-not-found
