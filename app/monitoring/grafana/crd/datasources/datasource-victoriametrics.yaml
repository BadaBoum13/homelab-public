---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoriametrics-datasource
  namespace: monitoring
spec:
  datasource:
    name: victoriaMetrics
    type: prometheus
    access: proxy
    url: http://vmsingle-vm-single.monitoring.svc.cluster.local:8428
    isDefault: true
    editable: true
  instanceSelector:
    matchLabels:
      app: "grafana"
