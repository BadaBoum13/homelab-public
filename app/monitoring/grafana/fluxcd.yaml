---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 1h
  url: https://grafana.github.io/helm-charts
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - .
configMapGenerator:
  - name: grafana-values
    files:
      - values.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 5m
  install:
    createNamespace: true
  targetNamespace: monitoring
  chart:
    spec:
      chart: grafana
      releaseName: grafana
      # version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
    valuesFrom:
      - kind: ConfigMap
        name: grafana-values