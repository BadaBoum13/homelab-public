---
version: '3'

tasks:
  default:
    desc: Deploy Prometheus Operator CRDs
    cmds:
      - task: deploy

  deploy:
    desc: Deploy Prometheus Operator CRDs using Helm
    vars:
      MONITORING_NS: monitoring
      REPO_NAME: oci://ghcr.io/prometheus-community/charts/prometheus-operator-crds
      RELEASE_NAME: prometheus-operator-crds
    cmds:
      - helm upgrade --install {{.RELEASE_NAME}} {{.REPO_NAME}} -n {{.MONITORING_NS}}

  clean:
    desc: Remove Prometheus Operator CRDs
    vars:
      MONITORING_NS: monitoring
      RELEASE_NAME: prometheus-operator-crds
    cmds:
      - helm uninstall {{.RELEASE_NAME}} -n {{.MONITORING_NS}} --ignore-not-found
