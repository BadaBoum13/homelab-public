apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: cadvisor-metrics
  namespace: monitoring
spec:
  honorLabels: true
  scheme: https
  tlsConfig:
    insecureSkipVerify: true
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token

  relabelConfigs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)

    - targetLabel: __address__
      replacement: kubernetes.default.svc:443

    - sourceLabels: [__meta_kubernetes_node_name]
      targetLabel: __metrics_path__
      replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

    - source_labels: [__meta_kubernetes_namespace]
      separator: ;
      target_label: namespace
      replacement: $1
      action: replace
    - source_labels: [__meta_kubernetes_service_name]
      separator: ;
      target_label: service
      replacement: $1
      action: replace
    - source_labels: [__meta_kubernetes_pod_name]
      separator: ;
      target_label: pod
      replacement: $1
      action: replace
    - source_labels: [__meta_kubernetes_pod_container_name]
      separator: ;
      target_label: container
      replacement: $1
      action: replace
    - source_labels: [__meta_kubernetes_service_label_k8s_app]
      separator: ;
      regex: (.+)
      target_label: job
      replacement: ${1}
      action: replace
  metricRelabelConfigs:
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    ##########
    # Ensure container exist
    ##########
    # 1. Extract container name from 'id' if 'container' is missing
    - sourceLabels: [id]
      regex: '.*/([^/]+)$'
      targetLabel: container
      action: replace
    # 2. Map 'pod_name' to 'pod' for consistency
    - sourceLabels: [pod_name]
      targetLabel: pod
      action: replace
    # 3. Ensure 'namespace' and 'pod' labels are clean
    - sourceLabels: [container]
      regex: '^POD$'
      action: drop
    # 4. Ensure Pod/Namespace labels exist
    - sourceLabels: [pod_name]
      targetLabel: pod
      action: replace
    - sourceLabels: [container_name]
      targetLabel: container
      action: replace
    ###########
    # Drop
    ###########
    # 1. DROP: Redundant ID label (Saves massive space)
    - sourceLabels: [id, pod]
      separator: ';'
      regex: '.+;.+'
      targetLabel: id
      replacement: ''
      action: replace
    # 2. DROP: Non-pod metrics (system noise like /system.slice)
    - sourceLabels: [pod]
      regex: '^$'
      action: drop
    # 3. DROP: High-volume "Spec" metrics you likely won't query
    - sourceLabels: [__name__]
      regex: 'container_spec.*|container_file_descriptors|container_tasks_state'
      action: drop
