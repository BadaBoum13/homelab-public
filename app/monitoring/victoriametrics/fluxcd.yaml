apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: victoriametrics
  namespace: monitoring
spec:
  interval: 1h
  url: https://victoriametrics.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoriametrics-crd
  namespace: monitoring
spec:
  interval: 5m
  targetNamespace: monitoring
  releaseName: victoriametrics
  valuesFrom:
    - kind: ConfigMap
      name: victoriametrics-values
  chart:
    spec:
      chart: victoria-metrics-operator-crds
      # version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: monitoring
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoriametrics
  namespace: monitoring
spec:
  interval: 5m
  targetNamespace: monitoring
  releaseName: victoriametrics
  dependsOn:
    - name: victoria-metrics-crds
  valuesFrom:
    - kind: ConfigMap
      name: victoriametrics-values
  chart:
    spec:
      chart: victoria-metrics-operator
      # version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: monitoring
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoriametrics-resources
  namespace: flux-system
spec:
  path: ./app/monitoring/victoriametrics/crd
  interval: 10m
  prune: true
  dependsOn:
    - name: victoriametrics-crd
  sourceRef:
    kind: GitRepository
    name: homelab-public
