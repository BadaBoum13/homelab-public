---
# register repository
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab-public
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/BadaBoum13/homelab-public.git
  ref:
    branch: main
  secretRef:
    name: github
---
# create apps
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./app
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-public
  wait: true