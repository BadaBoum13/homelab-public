---
version: '3'

includes:
  longhorn: ./longhorn
  nextcloud: ./nextcloud

tasks:
  default:
    desc: Deploy all storage components
    cmds:
      - task: namespace
      - task: repos
      - task: deploy

  namespace:
    desc: Create storage namespaces
    cmds:
      - kubectl create namespace longhorn-system --dry-run=client -o yaml | kubectl apply -f -
      - kubectl create namespace nextcloud --dry-run=client -o yaml | kubectl apply -f -

  repos:
    desc: Add/update all Helm repositories
    cmds:
      - task: longhorn:repos
      - task: nextcloud:repos

  deploy:
    desc: Deploy all storage components
    cmds:
      - task: longhorn:deploy
      - task: nextcloud:deploy

  clean:
    desc: Remove all storage components
    cmds:
      - task: nextcloud:clean
      - task: longhorn:clean
