# Alphanumeric only: the chart substitutes the passwords into its LDIF config
# with sed, so characters like "/" or "&" would break it.
apiVersion: redhatcop.redhat.io/v1alpha1
kind: PasswordPolicy
metadata:
  name: vco-openldap
  namespace: owncloud
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  authentication:
    path: kubernetes
    role: kubernetes
    serviceAccount:
      name: default
  passwordPolicy: |
    length = 32
    rule "charset" {
      charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
      min-chars = 1
    }
    rule "charset" {
      charset = "0123456789"
      min-chars = 1
    }
    rule "charset" {
      charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
      min-chars = 1
    }
