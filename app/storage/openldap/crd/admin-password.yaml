# Publishes the generated OpenLDAP passwords (random-secrets.yaml) as the
# chart's existingSecret. The admin password is also the oCIS bind password
# (app/shared/owncloud/crd/ldap.yaml).
apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: openldap-admin
  namespace: owncloud
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshPeriod: 1h
  vaultSecretDefinitions:
    - authentication:
        path: kubernetes
        role: kubernetes
        serviceAccount:
          name: default
      name: admin
      path: secret/data/owncloud/openldap-admin
    - authentication:
        path: kubernetes
        role: kubernetes
        serviceAccount:
          name: default
      name: config
      path: secret/data/owncloud/openldap-config
  output:
    name: openldap-admin
    stringData:
      LDAP_ADMIN_PASSWORD: '{{ .admin.password }}'
      LDAP_CONFIG_ADMIN_PASSWORD: '{{ .config.password }}'
    type: Opaque
