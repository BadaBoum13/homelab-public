# OpenLDAP admin/config passwords, generated once in OpenBao at
# secret/owncloud/openldap-{admin,config} (key: password).
# No refreshPeriod: OpenLDAP keeps the password in its database, so rotating it
# in OpenBao would lock oCIS out. Retain: deleting this resource keeps the value.
apiVersion: redhatcop.redhat.io/v1alpha1
kind: RandomSecret
metadata:
  name: openldap-admin
  namespace: owncloud
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  authentication:
    path: kubernetes
    role: kubernetes
    serviceAccount:
      name: default
  isKVSecretsEngineV2: true
  path: secret/data/owncloud
  secretKey: password
  secretFormat:
    passwordPolicyName: vco-openldap
  kvSecretRetainPolicy: Retain
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: RandomSecret
metadata:
  name: openldap-config
  namespace: owncloud
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  authentication:
    path: kubernetes
    role: kubernetes
    serviceAccount:
      name: default
  isKVSecretsEngineV2: true
  path: secret/data/owncloud
  secretKey: password
  secretFormat:
    passwordPolicyName: vco-openldap
  kvSecretRetainPolicy: Retain
