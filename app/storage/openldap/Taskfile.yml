---
version: '3'

tasks:
  default:
    desc: Deploy openldap
    cmds:
      - task: deploy

  repos:
    desc: Add openldap Helm repository
    vars:
      REPO_NAME: helm-openldap
    cmds:
      - helm repo add {{.REPO_NAME}} https://jp-gouin.github.io/helm-openldap/
      - helm repo update {{.REPO_NAME}}

  deploy:
    desc: Deploy openldap using Helm
    vars:
      NAMESPACE: owncloud
      CHART_NAME: openldap-stack-ha
      REPO_NAME: helm-openldap
      RELEASE_NAME: openldap
      VERSION: 4.3.3
    cmds:
      - kubectl create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f {{.TASKFILE_DIR}}/crd
      - helm upgrade --install {{.RELEASE_NAME}} {{.REPO_NAME}}/{{.CHART_NAME}} --version {{.VERSION}} -n {{.NAMESPACE}} -f {{.TASKFILE_DIR}}/values.yaml

  clean:
    desc: Remove openldap
    vars:
      NAMESPACE: owncloud
      RELEASE_NAME: openldap
    cmds:
      - helm uninstall {{.RELEASE_NAME}} -n {{.NAMESPACE}} --ignore-not-found
      - kubectl delete -f {{.TASKFILE_DIR}}/crd --ignore-not-found
