controllers:
  main:
    containers:
      main:
        env:
          # Connection URI generated by CloudNativePG (crd/database.yaml)
          DB_URL:
            valueFrom:
              secretKeyRef:
                name: immich-db-app
                key: uri

immich:
  persistence:
    library:
      existingClaim: immich-library   # crd/library-pvc.yaml
  # Auth0 OAuth config rendered from OpenBao (crd/oidc.yaml)
  existingConfiguration: immich-config
  configurationKind: Secret

valkey:
  enabled: true

server:
  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: cloudflare
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "immich"
      hosts:
        - host: immich.biduleproofzone.ovh
          paths:
            - path: "/"
              service:
                identifier: main
      tls:
        - secretName: immich-tls
          hosts:
            - immich.biduleproofzone.ovh
