---
version: '3'

tasks:
  default:
    desc: Deploy immich
    cmds:
      - task: deploy

  deploy:
    desc: Deploy immich using Helm
    vars:
      NAMESPACE: immich
      REPO_NAME: oci://ghcr.io/immich-app/immich-charts/immich
      RELEASE_NAME: immich
      VERSION: 0.13.4
    cmds:
      - kubectl create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f {{.TASKFILE_DIR}}/crd
      - helm upgrade --install {{.RELEASE_NAME}} {{.REPO_NAME}} --version {{.VERSION}} -n {{.NAMESPACE}} -f {{.TASKFILE_DIR}}/values.yaml

  clean:
    desc: Remove immich
    vars:
      NAMESPACE: immich
      RELEASE_NAME: immich
    cmds:
      - helm uninstall {{.RELEASE_NAME}} -n {{.NAMESPACE}} --ignore-not-found
      - kubectl delete -f {{.TASKFILE_DIR}}/crd --ignore-not-found
