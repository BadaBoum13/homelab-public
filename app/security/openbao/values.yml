global:
  enabled: true
  namespace: "security"

injector:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

server:
  affinity: {}
    # podAntiAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     - labelSelector:
    #         matchLabels:
    #           app.kubernetes.io/name: {{ template "openbao.name" . }}
    #           app.kubernetes.io/instance: "{{ .Release.Name }}"
    #           component: server
    #       topologyKey: kubernetes.io/hostname

  image:
    registry: ghcr.io
    repository: badaboum13/openbao-hsm
    tag: "1.0"


  # SoftHSM2 — the UBI image is glibc-based, same as the Ubuntu hosts,
  # so the host's libsofthsm2.so can be mounted directly.
  volumes:
    - name: softhsm-config
      hostPath:
        path: /etc/softhsm2.conf
        type: File
    - name: softhsm-tokens
      hostPath:
        path: /var/lib/softhsm/tokens
        type: Directory

  volumeMounts:
    - name: softhsm-config
      mountPath: /etc/softhsm2.conf
    - name: softhsm-tokens
      mountPath: /var/lib/softhsm/tokens

  extraEnvironmentVars:
    SOFTHSM2_CONF: /etc/softhsm2.conf
    LD_LIBRARY_PATH: /usr/lib/softhsm

  extraSecretEnvironmentVars:
    - envName: BAO_HSM_PIN
      secretName: openbao-hsm-pin
      secretKey: pin

  standalone:
    config: |
      ui = true

      # External URL (Traefik terminates TLS); needed so OIDC builds correct
      # redirect/callback URLs for the Auth0 login flow.
      api_addr = "https://openbao.biduleproofzone.ovh"

      listener "tcp" {
        tls_disable     = 1
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        telemetry {
          unauthenticated_metrics_access = true
        }
      }

      storage "file" {
        path = "/openbao/data"
      }

      seal "pkcs11" {
        lib             = "/usr/lib/softhsm/libsofthsm2.so"
        token_label     = "openbao-token"
        key_label       = "openbao-unseal-key"
        mechanism       = "CKM_RSA_PKCS_OAEP"
        hmac_key_label  = "openbao-hmac-key"
        rsa_oaep_hash   = "sha1"
      }

      telemetry {
        prometheus_retention_time      = "30s"
        disable_hostname               = true
      }
  # Settings for the statefulSet used to run OpenBao.
  statefulSet:
    annotations: {}
    securityContext:
      pod:
        runAsNonRoot: true
        runAsUser: 100 # UID from the custom image
        runAsGroup: 10000
        fsGroup: 10000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  dataStorage:
    enabled: true
    size: 1Gi
    mountPath: "/openbao/data"
    storageClass: longhorn
    accessMode: ReadWriteOnce

  logLevel: "error"
  logFormat: "json"

  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true"
    initialDelaySeconds: 60

  serviceAccount:
    create: true

  service:
    enabled: true
    type: ClusterIP
    port: 8200

  ui:
    enabled: true
    serviceType: ClusterIP

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: "cloudflare"
    hosts:
      - host: openbao.biduleproofzone.ovh
        paths:
          - /
    tls:
      - secretName: openbao-tls
        hosts:
          - openbao.biduleproofzone.ovh

  ha:
    enabled: false

ui:
  enabled: true
  serviceType: ClusterIP

serverTelemetry:
  # Enable support for the Prometheus Operator. If authorization is not required for
  # OpenBao's metrics endpoint, the following OpenBao server `telemetry{}` config must be included
  # in the `listener "tcp"{}` stanza
  #  telemetry {
  #    unauthenticated_metrics_access = "true"
  #  }
  #
  # See the `standalone.config` for a more complete example of this.
  #
  # In addition, a top level `telemetry{}` stanza must also be included in the OpenBao configuration:
  #
  # example:
  #  telemetry {
  #    prometheus_retention_time = "30s"
  #    disable_hostname = true
  #  }
  #
  # Configuration for monitoring the OpenBao server.
  serviceMonitor:
    # Enable deployment of the OpenBao Server ServiceMonitor CustomResource.
    enabled: true

    # Selector labels to add to the ServiceMonitor.
    # When empty, defaults to:
    #  release: prometheus
    selectors: {}

    # -- Port which Prometheus uses when scraping metrics. If empty will use `openbao.scheme` helper for its value
    port: ""

    # -- scheme to use when Prometheus scrapes metrics. If empty will use `openbao.scheme` helper for its value
    scheme: ""

    interval: 30s
    scrapeTimeout: 10s

  prometheusRules:
    # The Prometheus operator *must* be installed before enabling this feature,
    # if not the chart will fail to install due to missing CustomResourceDefinitions
    # provided by the operator.

    # Deploy the PrometheusRule custom resource for AlertManager based alerts.
    # Requires that AlertManager is properly deployed.
    enabled: false

    # Selector labels to add to the PrometheusRules.
    # When empty, defaults to:
    #  release: prometheus
    selectors: {}

    # Some example rules.
    rules: []
    #  - alert: vault-HighResponseTime
    #    annotations:
    #      message: The response time of OpenBao is over 500ms on average over the last 5 minutes.
    #    expr: vault_core_handle_request{quantile="0.5", namespace="mynamespace"} > 500
    #    for: 5m
    #    labels:
    #      severity: warning
    #  - alert: vault-HighResponseTime
    #    annotations:
    #      message: The response time of OpenBao is over 1s on average over the last 10 minutes.
    #    expr: vault_core_handle_request{quantile="0.5", namespace="mynamespace"} > 1000
    #    for: 10m
    #    labels:
    #      severity: critical

  grafanaDashboard:
    # Enable deployment of the OpenBao Grafana dashboard.
    # https://grafana.com/grafana/dashboards/23725-openbao
    enabled: false
