apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/BadaBoum13/homelab-public.git
    targetRevision: HEAD
    path: app/security/external-secrets-operator
    directory:
      recurse: false
      include: "cluster-secret-store.yml"
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
