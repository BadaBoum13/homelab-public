apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: renovate-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/BadaBoum13/homelab-public.git
    targetRevision: HEAD
    path: app/CD/renovate
    directory:
      recurse: true
      include: "crd/*"
  destination:
    server: https://kubernetes.default.svc
    namespace: renovate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
