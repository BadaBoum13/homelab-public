---
version: '3'

tasks:
  default:
    desc: Deploy ArgoCD
    cmds:
      - task: deploy

  repos:
    desc: Add ArgoCD Helm repository
    vars:
      REPO_NAME: argo
    cmds:
      - helm repo add {{.REPO_NAME}} https://argoproj.github.io/argo-helm
      - helm repo update {{.REPO_NAME}}

  deploy:
    desc: Deploy ArgoCD using Helm and bootstrap app-of-apps
    vars:
      NAMESPACE: argocd
      CHART_NAME: argo-cd
      REPO_NAME: argo
      RELEASE_NAME: argocd
    cmds:
      - kubectl apply --server-side=true -k https://github.com/argoproj/argo-cd/manifests/crds?ref=stable
      - helm upgrade --install {{.RELEASE_NAME}} {{.REPO_NAME}}/{{.CHART_NAME}} -n {{.NAMESPACE}} --create-namespace -f {{.TASKFILE_DIR}}/values.yml
      - kubectl apply -f {{.TASKFILE_DIR}}/crd
      # - kubectl apply -f {{.TASKFILE_DIR}}/../../argocd-bootstrap.yaml

  clean:
    desc: Remove ArgoCD
    vars:
      NAMESPACE: argocd
      RELEASE_NAME: argocd
    cmds:
      - helm uninstall {{.RELEASE_NAME}} -n {{.NAMESPACE}} --ignore-not-found
      - kubectl delete -k https://github.com/argoproj/argo-cd/manifests/crds?ref=stable --ignore-not-found
