apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nextcloud-secret
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nextcloud-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Nextcloud admin account
        nextcloud-username: "admin"
        nextcloud-password: "{{ .nextcloudPassword }}"
        # External PostgreSQL credentials (must match the postgresql user)
        postgres-username: "nextcloud"
        postgres-password: "{{ .postgresPassword }}"
  data:
    - secretKey: nextcloudPassword
      remoteRef:
        key: nextcloud-admin
        property: password
    - secretKey: postgresPassword
      remoteRef:
        key: postgresql-user
        property: password
