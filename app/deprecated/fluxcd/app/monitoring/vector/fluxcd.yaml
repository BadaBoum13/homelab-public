apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vector
  namespace: monitoring
spec:
  interval: 1h
  url: https://helm.vector.dev/

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
  namespace: monitoring
spec:
  interval: 5m
  targetNamespace: monitoring
  releaseName: vector
  valuesFrom:
    - kind: ConfigMap
      name: vector-values
  chart:
    spec:
      chart: vector
      # version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: vector
        namespace: monitoring
